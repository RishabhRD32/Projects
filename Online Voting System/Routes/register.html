<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Voting System - Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            transition: background-color 2s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .main-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            box-sizing: border-box;
        }

        .headerSection {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .headerSection h1 {
            font-size: 2.5rem;
            font-weight: 600;
            color: #3498db;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.15);
        }

        .form-container {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            transform: scale(1);
            transition: transform 0.3s ease;
        }

        .form-container:hover {
            transform: scale(1.02);
        }

        .form-heading {
            font-size: 1.8rem;
            font-weight: 600;
            color: #555;
            margin-bottom: 25px;
            position: relative;
        }

        .form-heading::after {
            content: '';
            width: 50px;
            height: 3px;
            background-color: #3498db;
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 5px;
        }

        .registration-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
            align-items: stretch;
        }

        .input-group {
            text-align: left;
            position: relative; /* For error messages */
        }

        .input-group label {
            display: block;
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 5px;
        }

        .registration-form input,
        .registration-form select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: all 0.3s ease;
            background-color: #f8f9fa;
        }

        .registration-form input:focus,
        .registration-form select:focus {
            border-color: #3498db;
            box-shadow: 0 0 8px rgba(52, 152, 219, 0.2);
            background-color: #fff;
            outline: none;
        }

        .image-upload-section {
            border: 2px dashed #a0a0a0;
            border-radius: 10px;
            padding: 20px;
            background-color: #fafafa;
            cursor: pointer;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .image-upload-section:hover {
            background-color: #f5f5f5;
            border-color: #3498db;
        }

        .upload-label {
            font-size: 1rem;
            color: #888;
            display: block;
        }

        .file-input {
            display: none;
        }

        .role-selection {
            text-align: left;
        }

        .register-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .register-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .login-link {
            font-size: 0.9rem;
            margin-top: 25px;
            color: #666;
        }

        .login-link a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .login-link a:hover {
            color: #2980b9;
            text-decoration: underline;
        }

        .error-message {
            color: #e74c3c;
            font-size: 0.8rem;
            margin-top: 5px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <header class="headerSection">
            <h1>Online Voting System</h1>
        </header>
        <div class="form-container">
            <h2 class="form-heading">Register Your Account</h2>
            <form action="../API/register.php" method="post" enctype="multipart/form-data" class="registration-form" onsubmit="return validateForm()">
                <div class="input-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>
                <div class="input-group">
                    <label for="mobile">Mobile No.</label>
                    <input type="tel" id="mobile" name="mobile" placeholder="Enter your mobile number" required>
                    <span id="mobileError" class="error-message"></span>
                </div>
                 <div class="input-group">
                    <label for="aadhaar">Aadhaar Card No.</label>
                    <input type="tel" id="aadhaar" name="aadhaar" placeholder="Enter 12-digit Aadhaar number" required>
                    <span id="aadhaarError" class="error-message"></span>
                </div>
                <div class="input-group">
                    <label for="voterid">Voter ID</label>
                    <input type="text" id="voterid" name="voterid" placeholder="Enter Voter ID (e.g., ABC1234567)" required>
                    <span id="voteridError" class="error-message"></span>
                </div>
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    <span id="emailError" class="error-message"></span>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password" required>
                </div>
                <div class="input-group">
                    <label for="cpassword">Confirm Password</label>
                    <input type="password" id="cpassword" name="cpassword" placeholder="Confirm your password" required>
                </div>
                <div class="input-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address" placeholder="Enter your address" required>
                </div>
                <div class="input-group">
                    <label for="photo">Upload Photo</label>
                    <input type="file" id="photo" name="photo" required>
                </div>
                <div class="input-group">
                    <label for="role">Select Your Role</label>
                    <select id="role" name="role">
                        <option value="1">Voter</option>
                        <option value="2">Group</option>
                    </select>
                </div>
                <div class="g-recaptcha" data-sitekey="6Le0_dArAAAAACRHKTVjLc_Ew0hWpSEtCSW9Gs4Y"></div>
                <button type="submit" class="register-btn">Register</button>
            </form>
            <p class="login-link">Already a user? <a href="../index.html">Login here</a></p>
        </div>
    </div>

    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <script>
        const colors = ['#e6f2ff', '#e0e8f0', '#f0f5e6', '#f5e6f0'];
        let colorIndex = 0;
        
        function changeBgColor() {
            document.body.style.backgroundColor = colors[colorIndex];
            colorIndex = (colorIndex + 1) % colors.length;
        }

        setInterval(changeBgColor, 1000);
        changeBgColor();

        function validateForm() {
            const mobile = document.getElementById('mobile').value;
            const aadhaar = document.getElementById('aadhaar').value;
            const voterid = document.getElementById('voterid').value;
            const email = document.getElementById('email').value;

            const mobileError = document.getElementById('mobileError');
            const aadhaarError = document.getElementById('aadhaarError');
            const voteridError = document.getElementById('voteridError');
            const emailError = document.getElementById('emailError');
            let isValid = true;

            // Reset error messages
            mobileError.textContent = '';
            aadhaarError.textContent = '';
            voteridError.textContent = '';
            emailError.textContent = '';

            // Mobile number validation (10 digits)
            if (!/^[0-9]{10}$/.test(mobile)) {
                mobileError.textContent = 'Please enter a valid 10-digit mobile number.';
                isValid = false;
            }

            // Aadhaar validation (12 digits)
            if (!/^[0-9]{12}$/.test(aadhaar)) {
                aadhaarError.textContent = 'Please enter a valid 12-digit Aadhaar number.';
                isValid = false;
            }

            // Voter ID validation (example format: ABC1234567)
            if (!/^[A-Z]{3}[0-9]{7}$/.test(voterid.toUpperCase())) {
                voteridError.textContent = 'Please enter a valid Voter ID (e.g., ABC1234567).';
                isValid = false;
            }

            // Email validation
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                emailError.textContent = 'Please enter a valid email address.';
                isValid = false;
            }

            return isValid;
        }
    </script>
</body>
</html>
