<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puzzles Quiz - AptitudeHub</title>
<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f8f9fa;
    margin: 0;
    padding: 0;
    text-align: center;
}
h1 { margin-top: 30px; color: #0066cc; }

.step, .question-card {
    max-width: 700px;
    margin: 20px auto;
    background-color: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    text-align: left;
}

.step h2, .question-card h3 { color: #004080; }

.btn-back, .btn-start, .btn-option, .btn-nav, .btn-restart {
    display: inline-block;
    padding: 12px 24px;
    margin: 10px 5px;
    border-radius: 5px;
    font-size: 1rem;
    cursor: pointer;
    border: none;
    text-decoration: none;
    transition: 0.3s;
}

.btn-back { background-color: #0066cc; color: #fff; }
.btn-back:hover { background-color: #004080; }

.btn-start { background-color: #28a745; color: #fff; }
.btn-start:hover { background-color: #1e7e34; }

.btn-option {
    display: block;
    width: 100%;
    margin: 8px 0;
    padding: 10px;
    border: 1px solid #0066cc;
    border-radius: 5px;
    background-color: #f8f9fa;
}
.btn-option:hover { background-color: #0066cc; color: #fff; }

.result { margin-top: 20px; font-weight: bold; text-align: center; font-size: 1.1rem; }

.progress-container {
    width: 100%;
    background-color: #e0e0e0;
    border-radius: 10px;
    margin: 20px auto;
    height: 20px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background-color: #0066cc;
    border-radius: 10px;
    transition: width 0.3s;
}
</style>
</head>
<body>

<h1>Puzzles Quiz</h1>

<!-- Step 1: Select Difficulty -->
<div class="step" id="difficulty-step">
    <h2>Select Difficulty</h2>
    <button class="btn-start" onclick="startQuiz('easy')">Easy</button>
    <button class="btn-start" onclick="startQuiz('medium')">Medium</button>
    <button class="btn-start" onclick="startQuiz('hard')">Hard</button>
</div>

<!-- Quiz Step -->
<div class="question-card" id="quiz-step" style="display:none;">
    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>
    <h3 id="question-text">Question will appear here</h3>
    <div class="options">
        <button class="btn-option" id="option0" onclick="selectAnswer(0)"></button>
        <button class="btn-option" id="option1" onclick="selectAnswer(1)"></button>
        <button class="btn-option" id="option2" onclick="selectAnswer(2)"></button>
        <button class="btn-option" id="option3" onclick="selectAnswer(3)"></button>
    </div>
    <div class="result" id="result"></div>
    <div style="margin-top:15px;">
        <button class="btn-nav" onclick="prevQuestion()">Previous</button>
        <button class="btn-nav" onclick="nextQuestion()">Next</button>
    </div>
    <div style="margin-top:20px;">
        <a href="practice.html" class="btn-back">Back to Categories</a>
        <a href="index.html" class="btn-back">Back to Home</a>
    </div>
</div>

<script>
const questions = {
easy:[
{question:"What comes next in the series: 2, 4, 8, 16, ?", options:["18","32","24","20"], answer:"32"},
{question:"Find the odd one: Apple, Orange, Banana, Car", options:["Apple","Orange","Banana","Car"], answer:"Car"},
{question:"If A=1, B=2, C=3..., then D+E=?", options:["7","9","5","6"], answer:"9"},
{question:"Complete the sequence: 1, 3, 5, 7, ?", options:["9","10","11","8"], answer:"9"},
{question:"How many sides does a hexagon have?", options:["5","6","7","8"], answer:"6"},
{question:"If yesterday was Monday, tomorrow will be?", options:["Wednesday","Tuesday","Thursday","Monday"], answer:"Wednesday"},
{question:"Which number is divisible by 3?", options:["14","21","25","32"], answer:"21"},
{question:"Find next number: 10, 20, 30, ?", options:["40","45","50","35"], answer:"40"},
{question:"Identify the odd one: Cat, Dog, Fish, Car", options:["Cat","Dog","Fish","Car"], answer:"Car"},
{question:"Which is the smallest prime number?", options:["0","1","2","3"], answer:"2"}
],
medium:[
{question:"Find the missing number: 5, 10, 20, 40, ?", options:["70","80","90","100"], answer:"80"},
{question:"If 3x + 2 = 11, find x", options:["2","3","4","5"], answer:"3"},
{question:"Which shape has 4 equal sides?", options:["Rectangle","Square","Triangle","Circle"], answer:"Square"},
{question:"If today is Sunday, what day will be after 100 days?", options:["Tuesday","Monday","Wednesday","Thursday"], answer:"Tuesday"},
{question:"Find odd one: Car, Bike, Bus, Apple", options:["Car","Bike","Bus","Apple"], answer:"Apple"},
{question:"Complete the series: 2, 6, 12, 20, ?", options:["30","28","24","32"], answer:"30"},
{question:"If 5 pencils cost $10, cost of 8 pencils?", options:["15","16","18","20"], answer:"16"},
{question:"Which number is divisible by 5?", options:["11","20","21","19"], answer:"20"},
{question:"Find next number: 1, 4, 9, 16, ?", options:["20","25","30","36"], answer:"25"},
{question:"Identify the odd one: Lion, Tiger, Dog, Elephant", options:["Lion","Tiger","Dog","Elephant"], answer:"Dog"}
],
hard:[
{question:"Solve the puzzle: A is older than B, B is older than C, C is older than D. Who is youngest?", options:["A","B","C","D"], answer:"D"},
{question:"If 2 pencils + 3 pens = 10, 4 pencils + 1 pen = 8, find value of 1 pencil?", options:["1","2","3","4"], answer:"2"},
{question:"Find missing in series: 1,1,2,6,24,?", options:["24","120","1200","720"], answer:"120"},
{question:"Which cube has 3 visible faces colored if cube has 2 opposite faces colored?", options:["1","2","3","4"], answer:"2"},
{question:"Riddle: What has keys but can't open locks?", options:["Piano","Door","Keyboard","Car"], answer:"Piano"},
{question:"Logical Puzzle: If all cats are animals and all animals are mammals, are all cats mammals?", options:["Yes","No","Cannot say","Maybe"], answer:"Yes"},
{question:"Find the missing number: 3, 6, 18, 72, ?", options:["144","216","288","360"], answer:"288"},
{question:"Which is next: J, F, M, A, M, ?", options:["J","A","J","S"], answer:"J"},
{question:"Puzzle: Divide 30 by half and add 10", options:["25","40","70","50"], answer:"70"},
{question:"Riddle: Forward I am heavy, backward I am not. What am I?", options:["Ton","Net","Stone","Not"], answer:"Ton"}
]
};

let currentDifficulty = '';
let quizData = [];
let currentQuestion = 0;
let score = 0;

function startQuiz(level){
    currentDifficulty = level;
    quizData = questions[level];
    currentQuestion = 0;
    score = 0;
    document.getElementById('difficulty-step').style.display = 'none';
    document.getElementById('quiz-step').style.display = 'block';
    updateProgressBar();
    showQuestion();
}

function showQuestion(){
    const q = quizData[currentQuestion];
    document.getElementById('question-text').innerText = `Q${currentQuestion+1}: ${q.question}`;
    for(let i=0;i<4;i++){
        const btn = document.getElementById('option'+i);
        btn.innerText = q.options[i];
        btn.disabled = false;
        btn.style.backgroundColor = '#f8f9fa';
        btn.style.color = '#000';
    }
    document.getElementById('result').innerText = '';
    updateProgressBar();
}

function selectAnswer(index){
    const selected = quizData[currentQuestion].options[index];
    const correct = quizData[currentQuestion].answer;
    const resultEl = document.getElementById('result');

    if((Array.isArray(correct) && correct.includes(selected)) || selected === correct){
        resultEl.innerText = "Correct Answer!";
        resultEl.style.color = "#28a745";
        score++;
    } else {
        resultEl.innerText = `Wrong Answer! Correct: ${Array.isArray(correct)? correct.join(' or ') : correct}`;
        resultEl.style.color = "#dc3545";
    }

    for(let i=0;i<4;i++){
        document.getElementById('option'+i).disabled = true;
    }
    updateProgressBar();
}

function nextQuestion(){
    if(currentQuestion < quizData.length -1){
        currentQuestion++;
        showQuestion();
    } else { showFinalScore(); }
}

function prevQuestion(){
    if(currentQuestion > 0){
        currentQuestion--;
        showQuestion();
    }
}

function showFinalScore(){
    const quizStep = document.getElementById('quiz-step');
    quizStep.innerHTML = `
        <h2>Quiz Completed!</h2>
        <p>Your Score: ${score} / ${quizData.length}</p>
        <button class="btn-restart" onclick="restartQuiz()">Restart Quiz</button>
        <div style="margin-top:20px;">
            <a href="practice.html" class="btn-back">Back to Categories</a>
            <a href="index.html" class="btn-back">Back to Home</a>
        </div>
    `;
}

function restartQuiz(){
    document.getElementById('difficulty-step').style.display = 'block';
    document.getElementById('quiz-step').style.display = 'none';
    document.getElementById('progress-bar').style.width = '0%';
}

function updateProgressBar(){
    const progressPercent = ((currentQuestion)/quizData.length)*100;
    document.getElementById('progress-bar').style.width = progressPercent + '%';
}
</script>
</body>
</html>
