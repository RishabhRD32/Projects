<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice - AptitudeHub</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        h1 {
            margin-top: 50px;
            color: #0066cc;
        }

        p {
            margin: 20px auto;
            max-width: 600px;
            color: #333;
        }

        .btn-back {
            display: inline-block;
            padding: 12px 24px;
            margin-top: 30px;
            background-color: #0066cc;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .btn-back:hover {
            background-color: #004080;
        }

        .category-list {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 40px;
        }

        .category-card {
            background-color: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 250px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
        }

        .category-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #0066cc;
        }

        .category-card h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .category-card a {
            color: #0066cc;
            text-decoration: none;
            font-weight: 500;
        }

        .category-card a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>Practice Questions</h1>
    <p>Choose a category below to start practicing aptitude questions and improve your skills.</p>

    <div class="category-list">
        <div class="category-card">
            <div class="category-icon">🧮</div>
            <h3>Quantitative Aptitude</h3>
            <a href="quantitative.html">Start Practicing →</a>
        </div>
        <div class="category-card">
            <div class="category-icon">💡</div>
            <h3>Logical Reasoning</h3>
            <a href="logical.html">Start Practicing →</a>
        </div>
        <div class="category-card">
            <div class="category-icon">🔤</div>
            <h3>Verbal Ability</h3>
            <a href="verbal.html">Start Practicing →</a>
        </div>
        <div class="category-card">
            <div class="category-icon">🧩</div>
            <h3>Puzzles</h3>
            <a href="puzzles.html">Start Practicing →</a>
        </div>
    </div>

    <!-- Back to Home Button -->
    <a href="index.html" class="btn-back">Back to Home</a>

</body>
</html>
