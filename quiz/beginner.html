<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beginner Level - AptitudeHub</title>
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px;
      margin: 0;
    }
    .container {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      max-width: 600px;
      width: 100%;
    }
    h2 {
      color: #0066cc;
      margin-bottom: 20px;
      text-align: center;
    }
    .question-box {
      margin-bottom: 20px;
      font-size: 1.1rem;
      font-weight: 500;
      color: #333;
    }
    .options label {
      display: block;
      background: #f1f1f1;
      margin: 10px 0;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .options input {
      margin-right: 10px;
    }
    .options label:hover {
      background: #e2e6f7;
    }
    .btn {
      display: inline-block;
      background-color: #0066cc;
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 6px;
      margin-top: 10px;
      cursor: pointer;
      border: none;
      transition: background-color 0.3s;
    }
    .btn:hover {
      background-color: #004080;
    }
    .btn-group {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }
    .answer {
      display: none;
      margin-top: 15px;
      font-weight: bold;
    }
    .timer {
      text-align: right;
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Beginner Level Practice</h2>
    <div class="timer" id="timer">Time Left: 60s</div>

    <div class="question-box" id="question">Loading question...</div>
    <div class="options" id="options"></div>

    <button class="btn" onclick="checkAnswer()">Check Answer</button>
    <p class="answer" id="answer"></p>

    <div class="btn-group">
      <button class="btn" onclick="prevQuestion()">Previous</button>
      <button class="btn" onclick="nextQuestion()">Next</button>
    </div>
  </div>

  <script>
    // ✅ Beginner Level Question Bank
    const questions = [
      { q: "What is 25 + 47?", options: ["62", "72", "74", "76"], correct: 2 },
      { q: "Simplify: 8 × 6 ÷ 4", options: ["10", "12", "14", "16"], correct: 1 },
      { q: "Find the next number: 2, 4, 8, 16, ?", options: ["24", "30", "32", "34"], correct: 2 },
      { q: "What is 20% of 150?", options: ["20", "25", "30", "35"], correct: 2 },
      { q: "If a shirt costs ₹800 and is sold at 10% discount, selling price is:", options: ["₹700", "₹720", "₹750", "₹760"], correct: 3 },
      { q: "Ratio of 2:3 is equivalent to:", options: ["4:5", "6:9", "8:12", "Both 6:9 and 8:12"], correct: 3 },
      { q: "If A:B = 2:3 and B:C = 4:5, then A:C = ?", options: ["8:15", "2:5", "4:7", "6:15"], correct: 0 },
      { q: "If CAT is coded as DBU, then DOG is coded as:", options: ["EPH", "EOH", "DPH", "FPG"], correct: 0 },
      { q: "In a certain code, STAR = 3219, TARS = ?", options: ["2193", "2139", "2931", "3219"], correct: 0 },
      { q: "Passage: 'Ravi bought 3 apples (₹10 each) & 2 bananas (₹5 each). How much did he spend?'", options: ["₹35", "₹40", "₹50", "₹60"], correct: 2 }
    ];

    let currentIndex = 0;
    let timer = 60;
    let countdown;

    function loadQuestion() {
      const q = questions[currentIndex];
      document.getElementById("question").textContent = `${currentIndex + 1}. ${q.q}`;
      const optionsDiv = document.getElementById("options");
      optionsDiv.innerHTML = "";
      q.options.forEach((opt, i) => {
        optionsDiv.innerHTML += `
          <label><input type="radio" name="option" value="${i}"> ${opt}</label>
        `;
      });
      document.getElementById("answer").style.display = "none";
    }

    function checkAnswer() {
      const selected = document.querySelector('input[name="option"]:checked');
      if (!selected) {
        alert("Please select an option first.");
        return;
      }
      const correctIndex = questions[currentIndex].correct;
      const answerDiv = document.getElementById("answer");
      if (parseInt(selected.value) === correctIndex) {
        answerDiv.textContent = "✅ Correct!";
        answerDiv.style.color = "green";
      } else {
        answerDiv.textContent = `❌ Wrong! Correct answer: ${questions[currentIndex].options[correctIndex]}`;
        answerDiv.style.color = "red";
      }
      answerDiv.style.display = "block";
    }

    function nextQuestion() {
      currentIndex = (currentIndex + 1) % questions.length;
      loadQuestion();
    }

    function prevQuestion() {
      currentIndex = (currentIndex - 1 + questions.length) % questions.length;
      loadQuestion();
    }

    function startTimer() {
      countdown = setInterval(() => {
        document.getElementById("timer").textContent = `Time Left: ${timer}s`;
        if (timer <= 0) {
          clearInterval(countdown);
          alert("⏱️ Time's up!");
        }
        timer--;
      }, 1000);
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadQuestion();
      startTimer();
    });
  </script>
</body>
</html>
