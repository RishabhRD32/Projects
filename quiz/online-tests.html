<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AptitudeHub — Demo Online Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      margin: 0;
      padding: 20px;
    }
    .test-container {
      display: flex;
      gap: 20px;
      max-width: 1000px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    }
    .question-section {
      flex: 3;
    }
    .question-box h3 {
      margin-bottom: 15px;
    }
    .options label {
      display: block;
      margin: 8px 0;
      cursor: pointer;
    }
    .controls {
      margin-top: 20px;
    }
    .controls button {
      padding: 8px 14px;
      margin-right: 10px;
      border: none;
      background: #0066cc;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
    }
    .controls button:hover {
      background: #004080;
    }
    .sidebar {
      flex: 1;
      border-left: 2px solid #eee;
      padding-left: 20px;
    }
    .palette {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .palette button {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      border: 1px solid #0066cc;
      background: #fff;
      cursor: pointer;
    }
    .palette button.correct {
      background: #28a745; /* green */
      color: #fff;
    }
    .palette button.wrong {
      background: #dc3545; /* red */
      color: #fff;
    }
    .palette button.review {
      background: #ffc107; /* yellow */
      color: #000;
    }
    .timer {
      font-weight: bold;
      margin-bottom: 20px;
      color: #d9534f;
    }
  </style>
</head>
<body>

  <h2>📘 AptitudeHub — Demo Online Test</h2>
  <p>Category: <b>Mixed Aptitude</b> | Time left: <span id="timer">10:00</span></p>

  <div class="test-container">
    <!-- Left: Question Section -->
    <div class="question-section">
      <div id="question-box" class="question-box">
        Loading...
      </div>

      <div class="controls">
        <button onclick="prevQuestion()">Previous</button>
        <button onclick="nextQuestion()">Next</button>
        <button onclick="markForReview()">Mark for review</button>
        <button onclick="submitTest()">Submit Test</button>
      </div>
    </div>

    <!-- Right: Sidebar -->
    <div class="sidebar">
      <div class="timer" id="side-timer">Time left: 10:00</div>
      <h3>Question Palette</h3>
      <div class="palette" id="palette"></div>
    </div>
  </div>

  <script>
    // ✅ 10 Questions
    const questions = [
      {id:1,text:"If 5x = 20, what is x?",options:["2","4","5","10"],answer:"4"},
      {id:2,text:"Next number in the series: 2, 6, 12, 20, ?",options:["28","30","32","36"],answer:"28"},
      {id:3,text:"Synonym of 'Rapid'?",options:["Slow","Quick","Lazy","Weak"],answer:"Quick"},
      {id:4,text:"If cost price = 80 and selling price = 100, profit % is?",options:["10%","20%","25%","30%"],answer:"25%"},
      {id:5,text:"√144 = ?",options:["10","11","12","13"],answer:"12"},
      {id:6,text:"Which is the smallest prime number?",options:["0","1","2","3"],answer:"2"},
      {id:7,text:"Speed = Distance/Time. If Distance=120 km and Time=2h, Speed=?",options:["50","60","70","80"],answer:"60"},
      {id:8,text:"Opposite of 'Ancient'?",options:["Modern","Old","Historic","Past"],answer:"Modern"},
      {id:9,text:"Which gas do plants absorb during photosynthesis?",options:["Oxygen","Carbon dioxide","Nitrogen","Hydrogen"],answer:"Carbon dioxide"},
      {id:10,text:"The capital of France?",options:["London","Berlin","Paris","Rome"],answer:"Paris"}
    ];

    let current = 0;
    let answers = {};
    let review = {};
    let correctness = {}; // stores correct/wrong

    function loadQuestion(index) {
      const q = questions[index];
      if (!q) return;
      let html = `<h3>Q${q.id}. ${q.text}</h3><div class="options">`;
      q.options.forEach(opt => {
        const checked = answers[q.id] === opt ? "checked" : "";
        html += `<label><input type="radio" name="q${q.id}" value="${opt}" ${checked} onchange="selectAnswer(${q.id}, '${opt}')"> ${opt}</label>`;
      });
      html += "</div>";
      document.getElementById("question-box").innerHTML = html;
      updatePalette();
    }

    function selectAnswer(qid, option) {
      answers[qid] = option;
      review[qid] = false;

      // Check immediately if correct or wrong
      correctness[qid] = (option === questions.find(q => q.id === qid).answer) ? "correct" : "wrong";
      updatePalette();
    }

    function nextQuestion() {
      if (current < questions.length - 1) {
        current++;
        loadQuestion(current);
      }
    }
    function prevQuestion() {
      if (current > 0) {
        current--;
        loadQuestion(current);
      }
    }

    function markForReview() {
      review[questions[current].id] = true;
      updatePalette();
    }

    function updatePalette() {
      const palette = document.getElementById("palette");
      palette.innerHTML = "";
      questions.forEach((q, i) => {
        const btn = document.createElement("button");
        btn.textContent = q.id;

        if (review[q.id]) {
          btn.classList.add("review");
        } else if (correctness[q.id] === "correct") {
          btn.classList.add("correct");
        } else if (correctness[q.id] === "wrong") {
          btn.classList.add("wrong");
        }

        btn.onclick = () => { current = i; loadQuestion(current); };
        palette.appendChild(btn);
      });
    }

    function submitTest() {
      let score = 0;
      questions.forEach(q => {
        if (answers[q.id] === q.answer) score++;
      });
      alert(`Test Submitted!\nScore: ${score}/${questions.length}`);
    }

    // ✅ Timer — 10 minutes
    let timeLeft = 10 * 60;
    function updateTimer() {
      const minutes = String(Math.floor(timeLeft / 60)).padStart(2, '0');
      const seconds = String(timeLeft % 60).padStart(2, '0');
      document.getElementById("timer").textContent = `${minutes}:${seconds}`;
      document.getElementById("side-timer").textContent = `Time left: ${minutes}:${seconds}`;
      if (timeLeft <= 0) {
        submitTest();
      } else {
        timeLeft--;
        setTimeout(updateTimer, 1000);
      }
    }

    window.onload = function() {
      loadQuestion(0);
      updateTimer();
    };
  </script>
</body>
</html>
